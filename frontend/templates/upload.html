<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsightIQ | Upload Dataset</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="iq-sidebar">
    <div class="brand">Insight<span>IQ</span></div>
    <a class="nav-link" href="/"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
    <a class="nav-link" href="/upload"><i class="bi bi-cloud-upload-fill"></i><span>Upload Dataset</span></a>
    <a class="nav-link" href="/analytics"><i class="bi bi-bar-chart-line-fill"></i><span>Analytics</span></a>
    <a class="nav-link" href="/insights"><i class="bi bi-stars"></i><span>AI Insights</span></a>
  </nav>

  <main class="iq-main">
    <div class="iq-topbar">
      <div>
        <h1>Upload Dataset</h1>
        <p>Upload a sales CSV to clean, analyze, and visualize it.</p>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="iq-card">
          <form id="upload-form">
            <label for="file-input" class="iq-dropzone d-block" id="dropzone">
              <i class="bi bi-cloud-arrow-up fs-1"></i>
              <p class="mb-1 mt-2 fw-semibold" id="dropzone-text">Click to choose a CSV file, or drag it here</p>
              <p class="text-muted small mb-0">Required columns: Order ID, Customer Name, Region, Category, Product Name, Quantity, Sales, Profit, Order Date</p>
            </label>
            <input type="file" id="file-input" accept=".csv" class="d-none">

            <button type="submit" class="btn btn-iq-primary w-100 mt-3" id="upload-btn" disabled>
              <i class="bi bi-upload"></i> Upload &amp; Process
            </button>
          </form>

          <div id="upload-status" class="mt-3"></div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="iq-card">
          <div class="iq-section-title">Upload History</div>
          <div id="upload-history">
            <p class="text-muted small">Loading history&hellip;</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/upload.js"></script>
</body>
</html>
